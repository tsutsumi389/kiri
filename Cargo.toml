[package]
name = "kiri"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "AI-friendly image cutout CLI for e-commerce product photos"
repository = "https://github.com/tsutsumi389/kiri"
readme = "README.md"
keywords = ["image", "cutout", "avif", "cli", "ecommerce"]
categories = ["command-line-utilities", "multimedia::images"]

# パッケージ名を後から変更してもコマンド名が揺れないよう明示する
[[bin]]
name = "kiri"
path = "src/main.rs"

[lib]
name = "kiri"
path = "src/lib.rs"

[features]
# 既定は無効。**二つの理由がある。**
#
# 1. `tract-onnx` 0.23.7 の `rust-version` は 1.91 で、kiri の MSRV 1.85 を
#    超える。既定で有効にすると `cargo +1.85 check` が引数の綴りすら見ずに
#    落ちる。MSRV は「この版の rustc で使える」という約束なので、推論のために
#    黙って上げない
# 2. 素の kiri は clean build 50 秒 / 3.26MB で建つ。tract を足すと 200 秒 /
#    19.26MB になる。切り抜きの大半（単色背景の EC 素材）はモデルを要しないので、
#    その費用を全員に負わせる理由が無い
#
# 有効にすると `--segment` が動く。無効のまま `--segment isnet` を渡すと
# `SEGMENT_UNAVAILABLE` で断る（黙って off に落とさない）。
default = []
segment = ["dep:tract-onnx"]

[dependencies]
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
ravif = "0.13"
rgb = "0.8"
imgref = "1.10"
kamadak-exif = "0.6"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fast_image_resize = "5.1.4"
rayon = "1.12.0"
# pure Rust の ONNX 推論。C 依存は無い（`cargo tree -e normal` に `*-sys` が
# 1 つも現れない）。`segment` feature でのみ引く
tract-onnx = { version = "0.23.7", optional = true }

# `kiri compose` の組版。**文字だけに使う。**
#
# MSRV は 1.85.0 で kiri とちょうど同じ、`cargo tree -e normal` に `*-sys` は
# 1 つも現れない。clean release build の増分は 9.7 秒で、`tract-onnx` を足した
# ときの 200 秒とは桁が違う——**`segment` を feature で囲った 2 つの理由の
# どちらにも当たらない**ので、既定の依存として引く（計画 §10.4）。
#
# **`raster-images` を外してある。** 有効にすると resvg が自前のデコーダで
# `<image>` を読むが、kiri は EXIF の向きと ICC → sRGB を `image_io/load.rs` で
# 正規化している。そちらを迂回すると、**色と向きの契約が compose でだけ崩れる。**
# 画像は kiri が読んで自分で合成し、resvg へ渡すのは文字だけにする（計画 §10.3.3）。
# `svgz` も外す——外から SVG を受けない設計なので、読む相手が居ない
resvg = { version = "0.48.1", default-features = false, features = [
    "text",
    "system-fonts",
] }
# 字体に、その文字のグリフが在るかを見るためだけに引く。
#
# **`compose` が「黙って代替へ落ちない」と言うための足である。** 字体を 1 つに
# 絞っても、無い文字は豆腐（.notdef）として**描けてしまう**ので、描く前に
# 自分で見るしかない（計画 §10.11 の H3）。
#
# MSRV 1.63、依存ゼロ、`-sys` も無い。resvg と同じ作者の pure Rust 実装である
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# テストを回すためのプロファイル。**最適化しつつ assert を残す。**
#
# debug のままだと `tests/real_backgrounds.rs` の較正ベンチが手元で 861 秒、
# 標準ランナーでは 36 分かかる。画像処理を最適化なしで回しているためで、
# release にすると 41 秒（20.9 倍）になる。
#
# ただし素の release は `debug_assert!` と整数のオーバーフロー検査を落とす。
# 不変条件の一部はそこに預けてあるので（§5 の Phase 12）、落とすと守るものが
# 減る。lto と codegen-units は外す——テストの実行時間には効かないのに、
# ビルドだけが伸びる。
[profile.ci-test]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true
overflow-checks = true
