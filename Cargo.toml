[package]
name = "kiri"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "AI-friendly image cutout CLI for e-commerce product photos"
repository = "https://github.com/tsutsumi389/kiri"
readme = "README.md"
keywords = ["image", "cutout", "avif", "cli", "ecommerce"]
categories = ["command-line-utilities", "multimedia::images"]

# パッケージ名を後から変更してもコマンド名が揺れないよう明示する
[[bin]]
name = "kiri"
path = "src/main.rs"

[lib]
name = "kiri"
path = "src/lib.rs"

[features]
# 既定は無効。**二つの理由がある。**
#
# 1. `tract-onnx` 0.23.7 の `rust-version` は 1.91 で、kiri の MSRV 1.85 を
#    超える。既定で有効にすると `cargo +1.85 check` が引数の綴りすら見ずに
#    落ちる。MSRV は「この版の rustc で使える」という約束なので、推論のために
#    黙って上げない
# 2. 素の kiri は clean build 50 秒 / 3.26MB で建つ。tract を足すと 200 秒 /
#    19.26MB になる。切り抜きの大半（単色背景の EC 素材）はモデルを要しないので、
#    その費用を全員に負わせる理由が無い
#
# 有効にすると `--segment` が動く。無効のまま `--segment isnet` を渡すと
# `SEGMENT_UNAVAILABLE` で断る（黙って off に落とさない）。
default = []
segment = ["dep:tract-onnx"]

[dependencies]
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
ravif = "0.13"
rgb = "0.8"
imgref = "1.10"
kamadak-exif = "0.6"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fast_image_resize = "5.1.4"
rayon = "1.12.0"
# pure Rust の ONNX 推論。C 依存は無い（`cargo tree -e normal` に `*-sys` が
# 1 つも現れない）。`segment` feature でのみ引く
tract-onnx = { version = "0.23.7", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
